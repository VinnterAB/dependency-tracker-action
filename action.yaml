# action.yml
name: 'OWASP Dependency Track check'
description: 'Creates BoM and upload repository to OWASP Dependency Track to find vulnerabilities'
branding:
  icon: 'check-square'
  color: 'green'

inputs:
  url:
    description: 'URL of OWASP Dependency Track REST API'
    required: true
    default: 'https://dtrack.quobis.com/'
  key:
    description: 'Key to access OWASP Dependency Track REST API'
    required: true
    default: 'USEAVALIDKEY'
  language:
    description: 'Programming language'
    required: true
    default: 'nodejs'
  version:
    description: 'Version to send to Dependency Track (defaults to git ref)'
    required: false
  action:
    description: 'Action to perform: upload or delete (defaults to upload)'
    required: false
    default: 'upload'
  isLatest:
    description: 'Mark this version as the latest version (defaults to false)'
    required: false
    default: 'false'

outputs:
  riskscore:
    description: 'String with the number of vulnerabilities found'

runs:
  using: 'docker'
  image: 'Dockerfile'
  args:
    - ${{ inputs.url }}
    - ${{ inputs.key }}
    - ${{ inputs.language }}
    - ${{ inputs.version }}
    - ${{ inputs.action }}
    - ${{ inputs.isLatest }}

